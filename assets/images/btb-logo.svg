<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Break the Barriers Academy">
  <rect width="120" height="120" rx="30" fill="#0E0B14"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="#FFC800" stroke-opacity=".5" stroke-width="1.5"/>
  <!-- the wall -->
  <g fill="#FFC800">
    <rect x="22" y="86" width="34" height="14" rx="3"/>
    <rect x="60" y="86" width="38" height="14" rx="3"/>
    <rect x="22" y="68" width="20" height="14" rx="3"/>
    <rect x="46" y="68" width="32" height="14" rx="3"/>
    <rect x="82" y="68" width="16" height="14" rx="3"/>
    <rect x="22" y="50" width="30" height="14" rx="3"/>
  </g>
  <!-- bricks breaking loose -->
  <g fill="#FFC800">
    <rect x="57" y="52" width="13" height="9" rx="2" transform="rotate(-14 63.5 56.5)"/>
    <rect x="74" y="52" width="9" height="7" rx="2" transform="rotate(-24 78.5 55.5)" opacity=".7"/>
  </g>
  <!-- the barrier becomes a paper plane in flight -->
  <path d="M64 38 L102 16 L88 52 L79 39 Z" fill="#FFF9E6"/>
  <path d="M79 39 L102 16 L88 52 Z" fill="#8B3DFF"/>
</svg>
