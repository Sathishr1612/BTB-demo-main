# Only used if you deploy with the Supabase CLI (`supabase functions deploy`).
# The webhook is called by Razorpay (no user JWT), so JWT verification is off for it; it is protected by the HMAC signature.
[functions.razorpay-webhook]
verify_jwt = false

# Signed-out visitors may request links for free/preview lessons; the function checks access itself.
[functions.r2-video]
verify_jwt = false
